name: Package Apps

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also writes the verified "Math Monster Brawl.zip" (ditto, framework links intact) at the repo root.
      - name: Validate and package the exact tested revision
        run: npm run package:release -- --arch=universal
      - name: Retain the single app download (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: MathMonsterBattle-${{ github.run_number }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: Math Monster Brawl.zip
